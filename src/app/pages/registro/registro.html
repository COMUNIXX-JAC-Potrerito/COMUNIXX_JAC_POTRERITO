<section class="panel">
  <h2>Crear cuenta</h2>
  <p class="intro">Regístrate para radicar tus solicitudes más rápido.</p>

  @if (exito()) {
    <div class="ok">Registro exitoso. Te llevamos al inicio de sesión…</div>
  } @else {
    @if (error()) {
      <div class="alert">{{ error() }}</div>
    }

    <form (ngSubmit)="registrar()">
      <label>
        Nombre completo
        <input name="fullName" [(ngModel)]="fullName" required autocomplete="name" maxlength="120" placeholder="Nombre y apellidos" />
      </label>
      <label>
        Correo
        <input type="email" name="email" [(ngModel)]="email" required autocomplete="email" placeholder="correo@ejemplo.com" />
      </label>
      <label>
        Contraseña
        <input type="password" name="password" [(ngModel)]="password" required autocomplete="new-password" minlength="8"
          placeholder="Mínimo 8 caracteres, 1 mayúscula y 1 número" />
      </label>
      <label>
        Celular
        <input type="tel" name="phone" [(ngModel)]="phone" required autocomplete="tel" placeholder="300 000 0000" />
      </label>

      <button type="submit" [disabled]="enviando() || !fullName || !email || !password || !phone">
        {{ enviando() ? 'Creando…' : 'Registrarme' }}
      </button>
    </form>

    <p class="pie">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  }
</section>
