<div class="layout">
  <!-- Barra superior: marca + botón de menú (este último solo en móvil) -->
  <header class="topbar">
    <div class="brand">COMUNIX · Panel JAC</div>

    <button
      class="menu-btn"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuAbierto()"
      aria-label="Abrir menú"
    >
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="cuerpo">
    <!-- Capa oscura detrás del menú en móvil: tocarla lo cierra -->
    @if (menuAbierto()) {
      <div class="backdrop" (click)="cerrarMenu()"></div>
    }

    <!-- Menú lateral con grupos desplegables -->
    <aside class="sidebar" [class.abierto]="menuAbierto()">
      <nav class="menu">
        @for (g of grupos; track g.id) {
          <div class="grupo">
            <button
              class="grupo-cab"
              type="button"
              [class.expandido]="grupoEstaAbierto(g.id)"
              [attr.aria-expanded]="grupoEstaAbierto(g.id)"
              (click)="alternarGrupo(g.id)"
            >
              <span>{{ g.titulo }}</span>
              <span class="flecha"></span>
            </button>

            @if (grupoEstaAbierto(g.id)) {
              <div class="grupo-items">
                @for (item of itemsVisibles(g); track item.ruta) {
                  <a
                    [routerLink]="item.ruta"
                    routerLinkActive="active"
                    (click)="cerrarMenu()"
                  >{{ item.etiqueta }}</a>
                }
              </div>
            }
          </div>
        }

        <!-- Mensajes: opción suelta (chat interno entre dignatarios) -->
        <a
          class="suelto"
          routerLink="mensajes"
          routerLinkActive="active"
          (click)="cerrarMenu()"
        >Mensajes</a>
      </nav>

      <button class="logout secundario" (click)="salir()">Cerrar sesión</button>
    </aside>

    <!-- Contenido de la opción elegida -->
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
